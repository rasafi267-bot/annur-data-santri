{% extends 'base.html' %}{% block body %}<section class="panel"><h1>Cek Status Pendaftaran</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Nomor pendaftaran<input name="number" required></label><label>Tanggal lahir<input name="birth_date" type="date" required></label><button>Cek status</button></form>{% if r %}<hr><h2>{{r.name}}</h2><p>{{r.number}} · {{r.status}}</p><p>{{r.notes or ''}}</p>{% endif %}</section>{% endblock %}
